
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loan Application - LoanFlow</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- NAVIGATION -->
    <nav class="navbar navbar-dark">
        <div class="container">
            <a href="index.html" class="navbar-brand">LoanFlow</a>

            <div class="d-flex gap-2 flex-wrap">
                <a href="index.html" class="btn btn-outline-light">
                    Home
                </a>
                <a href="calculator.html" class="btn btn-outline-light">
                    Calculator
                </a>
                <a href="apply.html" class="btn btn-outline-light">
                    Apply
                </a>
                <button class="btn btn-warning" onclick="logout()">
                    Logout
                </button>
            </div>
        </div>
    </nav>

    <main class="container my-5">

        <div class="text-center mb-5">
            <h1>Loan Application</h1>
            <p class="text-muted">
                Submit a loan request and track its status.
            </p>
        </div>

        <div class="row g-4">

            <!-- APPLICATION FORM -->
            <div class="col-lg-5">
                <div class="card h-100">
                    <div class="card-body p-4">

                        <h3 class="mb-4">Apply for a Loan</h3>

                        <form id="loanApplicationForm">

                            <div class="mb-3">
                                <label class="form-label">
                                    Loan Amount (€)
                                </label>
                                <input type="number"
                                       id="applyAmount"
                                       class="form-control"
                                       min="1"
                                       step="0.01"
                                       required>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">
                                    Annual Interest Rate (%)
                                </label>
                                <input type="number"
                                       id="applyRate"
                                       class="form-control"
                                       min="0"
                                       step="0.01"
                                       value="6"
                                       required>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">
                                    Loan Term (Months)
                                </label>
                                <input type="number"
                                       id="applyMonths"
                                       class="form-control"
                                       min="1"
                                       step="1"
                                       required>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">
                                    Loan Purpose
                                </label>
                                <select id="applyPurpose"
                                        class="form-select" required>
                                    <option value="">Select purpose</option>
                                    <option value="Education">Education</option>
                                    <option value="Car">Car</option>
                                    <option value="Travel">Travel</option>
                                    <option value="Business">Business</option>
                                    <option value="Personal">Personal</option>
                                </select>
                            </div>

                            <button type="submit"
                                    class="btn btn-primary w-100">
                                Submit Application
                            </button>

                        </form>

                        <div id="applicationMessage"
                             class="mt-3"
                             aria-live="polite"></div>

                    </div>
                </div>
            </div>

            <!-- APPLICATION STATUS -->
            <div class="col-lg-7">
                <div class="card h-100">
                    <div class="card-body p-4">

                        <h3 class="mb-3">My Loan Applications</h3>

                        <p class="text-muted">
                            View the current status of your requests.
                        </p>

                        <div class="table-responsive">
                            <table class="table table-hover align-middle">
                                <thead>
                                    <tr>
                                        <th>ID</th>
                                        <th>Amount</th>
                                        <th>Purpose</th>
                                        <th>Months</th>
                                        <th>Status</th>
                                    </tr>
                                </thead>

                                <tbody id="myApplications">
                                </tbody>
                            </table>
                        </div>

                    </div>
                </div>
            </div>

        </div>
    </main>

    <footer>
        LoanFlow © 2026 | Educational Project
    </footer>

    <script src="script.js"></script>
</body>
</html>
