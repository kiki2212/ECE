
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Dashboard - LoanFlow</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- NAVIGATION -->
    <nav class="navbar navbar-dark">
        <div class="container">
            <a class="navbar-brand" href="admin.html">
                LoanFlow | Admin
            </a>

            <button class="btn btn-warning" onclick="logout()">
                Logout
            </button>
        </div>
    </nav>

    <main class="container my-5">

        <h1>Admin Dashboard</h1>
        <p class="text-muted">
            Review and manage loan applications.
        </p>

        <!-- STATISTICS -->
        <div class="row g-3 my-4">

            <div class="col-md-3">
                <div class="card text-center">
                    <div class="card-body">
                        <h3 id="totalLoans">0</h3>
                        <p>Total Applications</p>
                    </div>
                </div>
            </div>

            <div class="col-md-3">
                <div class="card text-center">
                    <div class="card-body">
                        <h3 id="pendingLoans">0</h3>
                        <p>Pending</p>
                    </div>
                </div>
            </div>

            <div class="col-md-3">
                <div class="card text-center">
                    <div class="card-body">
                        <h3 id="approvedLoans">0</h3>
                        <p>Approved</p>
                    </div>
                </div>
            </div>

            <div class="col-md-3">
                <div class="card text-center">
                    <div class="card-body">
                        <h3 id="rejectedLoans">0</h3>
                        <p>Rejected</p>
                    </div>
                </div>
            </div>

        </div>

        <!-- APPLICATION TABLE -->
        <div class="card">
            <div class="card-body p-4">

                <h3 class="mb-4">Loan Applications</h3>

                <div class="table-responsive">
                    <table class="table table-hover align-middle">
                        <thead>
                            <tr>
                                <th>Applicant</th>
                                <th>Amount</th>
                                <th>Purpose</th>
                                <th>Term</th>
                                <th>Status</th>
                                <th>Actions</th>
                            </tr>
                        </thead>

                        <tbody id="adminApplications">
                        </tbody>
                    </table>
                </div>

                <p id="adminMessage"
                   class="mt-3"
                   aria-live="polite"></p>

            </div>
        </div>

    </main>

    <footer>
        LoanFlow © 2026 | Educational Project
    </footer>

    <script src="script.js"></script>
</body>
</html>
