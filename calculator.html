
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Loan Calculator - LoanFlow</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- NAVIGATION -->
    <nav class="navbar navbar-dark">
        <div class="container">

            <a href="index.html" class="navbar-brand">
                LoanFlow
            </a>

            <div class="d-flex gap-2">
                <a href="index.html"
                   class="btn btn-outline-light">Home</a>

                <a href="apply.html"
                   class="btn btn-outline-light">Apply</a>

                <button onclick="logout()"
                        class="btn btn-warning">Logout</button>
            </div>

        </div>
    </nav>

    <!-- CALCULATOR -->
    <main class="container my-5">

        <div class="text-center mb-4">
            <h1>Loan Calculator</h1>

            <p class="text-muted">
                Estimate your loan payments in seconds.
            </p>
        </div>

        <div class="card shadow-sm mx-auto"
             style="max-width: 600px;">

            <div class="card-body p-4">

                <form id="calculatorForm">

                    <div class="mb-3">
                        <label class="form-label">
                            Loan Amount (€)
                        </label>

                        <input type="number"
                               id="loanAmount"
                               class="form-control"
                               min="1"
                               step="0.01"
                               required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">
                            Annual Interest Rate (%)
                        </label>

                        <input type="number"
                               id="interestRate"
                               class="form-control"
                               min="0"
                               step="0.01"
                               required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">
                            Loan Term (Months)
                        </label>

                        <input type="number"
                               id="loanMonths"
                               class="form-control"
                               min="1"
                               step="1"
                               required>
                    </div>

                    <button type="submit"
                            class="btn btn-primary w-100">
                        Calculate Loan
                    </button>

                </form>

                <!-- RESULT -->
                <div id="loanResult" class="mt-4"
                     aria-live="polite"></div>

            </div>
        </div>

    </main>

    <script src="script.js"></script>
</body>
</html>
